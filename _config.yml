# Hexo 配置文件
# 官方文档: https://hexo.io/docs/configuration.html
# 修改后需要重启 hexo server 才生效

# ========== 站点信息 ==========
# 把下面这些改成你自己的信息
title: 顾杰的博客
subtitle: '记录技术与生活'
description: '一个 Java 程序员的技术博客'
keywords: Java, 后端, 编程, 技术笔记
author: Jack
language: zh-CN
timezone: 'Asia/Shanghai'

# ========== URL ==========
# 部署后改成你的博客地址，例如 https://zhangsan.github.io
# 注意结尾不要带斜杠
url: https://gujiedev.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ========== 目录 ==========
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ========== 写作 ==========
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ========== 首页分页 ==========
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ========== 分类 / 标签 ==========
default_category: uncategorized
category_map:
tag_map:

# ========== 日期格式 ==========
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ========== 分页 ==========
per_page: 10
pagination_dir: page

# ========== 包含 / 排除 ==========
include:
exclude:
ignore:

# ========== 主题 ==========
# 默认使用 landscape 主题，换主题只需改这一行 + npm install
# 热门主题: hexo-theme-butterfly / hexo-theme-fluid / hexo-theme-next
theme: landscape

# ========== 部署（可选，本地手动发布用） ==========
# 推荐用 GitHub Actions 自动部署（.github/workflows/deploy.yml），无需配这里
# 如需本地一键发布，取消下面注释并改成你的仓库地址：
# deploy:
#   type: git
#   repo: git@github.com:yourname/yourname.github.io.git
#   branch: main

# ========== 搜索插件配置 ==========
search:
  path: search.json
  field: post
  content: true
  format: html
